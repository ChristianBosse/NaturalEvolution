[workspace]
# Resolver 3 only picks dependency versions that support our rust-version (1.85).
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own Cargo.toml.
exclude = ["spikes"]

# The passphrase hash is slow on purpose; unoptimized, it would take seconds in every test.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "AGPL-3.0-only"
repository = "https://github.com/ChristianBosse/NaturalEvolution"

[workspace.dependencies]
blake3 = "=1.8.7"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
unicode-normalization = "=0.1.25"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
nevo-format = { path = "crates/nevo-format" }
nevo-store = { path = "crates/nevo-store" }
nevo-trust = { path = "crates/nevo-trust" }
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.6.11", features = ["fs", "set-header"] }
maud = "=0.27.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
fs4 = "=1.1.0"
serde_json = "=1.0.151"
# No default features: bundles carry no extended attributes.
tar = { version = "=0.4.46", default-features = false }
tantivy = { version = "=0.26.2", default-features = false, features = ["mmap", "stopwords", "lz4-compression", "stemmer"] }
nevo-search = { path = "crates/nevo-search" }
similar = "=3.2.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
zim = "=0.5.0"
zstd = "=0.13.3"
xz2 = "=0.1.7"
html5gum = "=0.8.4"
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
zeroize = "=1.9.0"
pdf-extract = "=0.12.1"
zip = { version = "=7.3.0", default-features = false, features = ["deflate-flate2"] }
