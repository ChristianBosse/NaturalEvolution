[workspace]
# Resolver 3 only picks dependency versions that support our rust-version (1.85).
resolver = "3"
members = ["crates/*"]
# Spikes are throwaway experiments with their own Cargo.toml.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/ChristianBosse/NaturalEvolution"

[workspace.dependencies]
blake3 = "=1.8.7"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.4.3"
unicode-normalization = "=0.1.25"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
tempfile = "=3.27.0"
nevo-format = { path = "crates/nevo-format" }
nevo-store = { path = "crates/nevo-store" }
nevo-trust = { path = "crates/nevo-trust" }
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.6.11", features = ["fs", "set-header"] }
maud = "=0.27.0"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
fs4 = "=1.1.0"
serde_json = "=1.0.151"
